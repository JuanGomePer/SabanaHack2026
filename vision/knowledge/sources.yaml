    title: "Manejo de humedad para el control de Botrytis en cultivos bajo cubierta"
    url: https://agrar.com.co/blog/manejo-humedad-control-botrytis-cultivos-bajo-cubierta.html
    type: blog_empresa
    author: AGRAR Ingeniería (autor individual no indicado)
    published: 2026-09-09
    evidence: >
      Botrytis favorecida por ~6 h de agua libre sobre hojas/flores/frutos y por 12-24 °C.
      Sabana de Bogotá: 5-18 °C, HR 70-85 % de día y hasta 90 % noche/madrugada.
      Productos: extractores, cortinas motorizadas, controladores. Distribuidor autorizado
      de Vostermans Ventilation. Menciona berries de forma genérica; no menciona arándano,
      sensores, nube, Azure ni Power BI.
    license: contenido web con derechos reservados; solo se cita
    confidence: alta
