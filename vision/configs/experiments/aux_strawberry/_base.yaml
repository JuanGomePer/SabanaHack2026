# Base de los experimentos auxiliares E4c (FRESA). NO evalúan arándano ni el robot.
# Propósito: validar el pipeline (datos por grupos, pérdidas, umbrales, análisis de FN)
# con etiquetas reales de enfermedad, mientras DrBerry siga bloqueado.
id: E4c_base
seed: 0
data:
  source_id: strawberry_traditional
  include_augmented: true          # aumentadas del autor, solo en train (val/test solo originales)
  healthy_class: strawberry_asymptomatic
  classes: [strawberry_asymptomatic, strawberry_gray_mold, strawberry_flower_blossom_blight,
            strawberry_fruit_anthracnose_rot, strawberry_fruit_powdery_mildew,
            strawberry_leaf_angular_leafspot, strawberry_leaf_powdery_mildew, strawberry_leaf_spot]
model: {name: resnet18, pretrained: true, freeze_backbone: false, dropout: 0.2, imgsz: 224}
augmentation:                      # moderada: no borra síntomas
  hflip: true
  vflip: true                      # hojas/frutos sin orientación canónica
  rotation: 15
  color_jitter: [0.2, 0.2, 0.15, 0.02]
  jpeg_quality: [60, 95]           # el robot entrega MJPEG
  blur_p: 0.15
loss: {name: ce}
train:
  optimizer: adamw
  lr: 0.0003
  backbone_lr_mult: 1.0
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 1
  epochs: 15
  patience: 5
  batch_size: 64
  num_workers: 4
  amp: true
  freeze_bn: false
threshold_rule: max_f2
recall_targets: [0.95, 0.98]
