# Blueprint de Render para Vigía (Sabana Hack 2026, reto Berry Good Idea).
#
# En el dashboard de Render: New → Blueprint → selecciona este repositorio.
# Render lee este archivo y crea los tres recursos de abajo (una base de
# datos Postgres + la API + el sitio estático del frontend) de una vez.
#
# Después del primer deploy, revisa en el servicio "vigia-api" que
# ROBOT_API_KEY quedó con un valor (Render genera uno solo porque
# `generateValue: true`) y pásaselo a quien vaya a mandar observaciones del
# módulo de visión por POST /api/observaciones.
#
# Si renombras los servicios "vigia-api" o "vigia-web", actualiza a mano las
# referencias cruzadas de abajo (CORS_ORIGIN y VITE_API_URL): Render no las
# resuelve solas entre nombres de servicio.

databases:
  # Sin "plan": usa el que Render tenga de entrada por defecto. Elige el tuyo
  # en el dashboard al confirmar el blueprint si quieres uno específico — los
  # nombres de plan cambian con el tiempo, así que no se fija uno aquí.
  - name: vigia-db
    databaseName: vigia

services:
  - type: web
    name: vigia-api
    runtime: node
    buildCommand: npm install && npm run build --workspace server
    startCommand: npm run start --workspace server
    # Migra el esquema y siembra los datos de ejemplo antes de que el deploy
    # reciba tráfico. El seed es idempotente (no hace nada si ya hay datos),
    # así que es seguro que corra en cada deploy, no solo en el primero.
    preDeployCommand: npm run db:migrate:deploy --workspace server && npm run db:seed --workspace server
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vigia-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ROBOT_API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: https://vigia-web.onrender.com

  - type: web
    name: vigia-web
    runtime: static
    buildCommand: npm install && npm run build --workspace web
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        value: https://vigia-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
