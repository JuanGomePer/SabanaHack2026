<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" fill="none">
  <defs>
    <linearGradient id="anillo" x1="90" y1="40" x2="210" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d8f74" />
      <stop offset="0.55" stop-color="#8a9a62" />
      <stop offset="1" stop-color="#7d93a6" />
    </linearGradient>
    <linearGradient id="pupila" x1="100" y1="80" x2="150" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7d93a6" />
      <stop offset="1" stop-color="#55707f" />
    </linearGradient>
  </defs>

  <!-- Hoja -->
  <path
    d="M98 38
       C58 34 24 58 20 98
       C16 136 44 164 82 168
       C84 140 84 112 84 96
       C84 78 90 58 98 38 Z"
    stroke="#1f5a3c"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M82 168 C74 140 66 108 98 72"
    stroke="#1f5a3c"
    stroke-width="6"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Ojo / mira -->
  <circle cx="124" cy="100" r="58" stroke="url(#anillo)" stroke-width="8" />
  <circle cx="124" cy="100" r="38" stroke="url(#anillo)" stroke-width="7" />
  <circle cx="124" cy="100" r="19" fill="url(#pupila)" />

  <!-- Línea de mira / sensor -->
  <line x1="82" y1="66" x2="140" y2="118" stroke="url(#pupila)" stroke-width="8" stroke-linecap="round" />

  <!-- Punta derecha, como el borde de un ojo/escáner -->
  <path d="M182 72 L212 100 L166 128" stroke="url(#anillo)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
